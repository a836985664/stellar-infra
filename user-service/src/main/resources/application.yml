# 用户服务运行时配置
# 说明：application.yml 只放"应用侧"业务配置——端口、数据源、JPA、第三方对接
# ⚠️ 敏感信息(JWT密钥/微信secret)建议后续通过 ${JWT_SECRET:default} 形式走环境变量，详见深度加固

server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Spring AI Ollama 对接
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:gemma4:31b-cloud}
          temperature: 0.7
      timeout: 60s

# JWT 配置
jwt:
  secret: ${JWT_SECRET:xyncyKe+TIJtTv2P/FUcx575oR9GU/Wvy7G7CeloqvM=}
  expiration: ${JWT_EXPIRATION:3600000}  # 默认 1 小时

# 微信配置（mock 占位，待替换为真实值）
wechat:
  appid: ${WECHAT_APPID:mock_appid}
  secret: ${WECHAT_SECRET:mock_secret}
  redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:8082/api/auth/wechat/callback}
