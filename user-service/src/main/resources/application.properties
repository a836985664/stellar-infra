# 用户服务运行时配置
# 说明：application.properties 只放"应用侧"业务配置——端口、数据源、JPA、第三方对接
# 敏感信息(JWT密钥/微信secret)建议后续通过 ${JWT_SECRET:default} 形式走环境变量，详见深度加固

server.port=8082

# ===== DataSource =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Spring AI Ollama =====
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:gemma4:31b-cloud}
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.timeout=60s

# ===== JWT =====
jwt.secret=${JWT_SECRET:xyncyKe+TIJtTv2P/FUcx575oR9GU/Wvy7G7CeloqvM=}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===== 微信（mock 占位，待替换为真实值）=====
wechat.appid=${WECHAT_APPID:mock_appid}
wechat.secret=${WECHAT_SECRET:mock_secret}
wechat.redirect-uri=${WECHAT_REDIRECT_URI:http://localhost:8082/api/auth/wechat/callback}

# ===== SpringDoc OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.example.user.controller
springdoc.paths-to-match=/api/**, /users/**, /config
springdoc.default-produces-media-type=application/json

# ===== Redis (分布式锁/缓存) =====
spring.data.redis.host=${REDIS_HOST:192.168.1.6}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:stellar123}
spring.data.redis.database=${REDIS_DATABASE:0}
