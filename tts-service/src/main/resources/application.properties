# TTS 服务运行时配置

server.port=8083

spring.application.name=tts-service
spring.jvm.args=--enable-native-access=ALL-UNNAMED

# ===== ChatTTS（Python 子进程对接）=====
# 历史硬编码绝对路径已改为环境变量，便于跨机器部署
chattts.python.path=${CHATTS_PYTHON_PATH:C:\\Users\\Administrator\\AppData\\Local\\Programs\\Python\\Python310\\python.exe}
chattts.script.path=${CHATTS_SCRIPT_PATH:D:\\ideaProject\\ChatTTS\\examples\\cmd\\run.py}
chattts.model.path=${CHATTS_MODEL_PATH:D:\\ideaProject\\ChatTTS\\}

# ===== SpringDoc OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.example.tts.controller
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
