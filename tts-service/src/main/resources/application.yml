# TTS 服务运行时配置

server:
  port: 8082

spring:
  application:
    name: tts-service
  jvm:
    args: --enable-native-access=ALL-UNNAMED

# ChatTTS 配置（Python 子进程对接）
# ⚠️ 历史硬编码绝对路径已改为环境变量，便于跨机器部署
chattts:
  python:
    path: ${CHATTS_PYTHON_PATH:C:\\Users\\Administrator\\AppData\\Local\\Programs\\Python\\Python310\\python.exe}
  script:
    path: ${CHATTS_SCRIPT_PATH:D:\\ideaProject\\ChatTTS\\examples\\cmd\\run.py}
  model:
    path: ${CHATTS_MODEL_PATH:D:\\ideaProject\\ChatTTS\\}
