# TTS 服务启动引导配置
# 说明：bootstrap.yml 只负责"引导"——指定服务名、连接 Nacos 配置中心、声明要加载的远端配置
# 业务相关配置（端口、ChatTTS 路径等）请放在 application.yml

spring:
  application:
    name: tts-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1}:8848
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: properties
        refresh-enabled: true
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1}:8848
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
      - nacos:common.yml
