# Nacos 动态配置示例（profile=nacos 时启用）

# 动态路由示例 - 从 Nacos 配置中心读取
spring.cloud.gateway.routes[0].id=${ROUTE_ID:user-service-route}
spring.cloud.gateway.routes[0].uri=${ROUTE_URI:lb://user-service}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[0].order=${ROUTE_ORDER:1000}

# 负载均衡权重配置
spring.cloud.gateway.routes[1].id=weighted-user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[1].order=1000
spring.cloud.gateway.routes[1].metadata.weight=80

# 限流配置
spring.cloud.gateway.routes[2].id=rate-limiter-route
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[2].filters[1].name=RequestRateLimiter
spring.cloud.gateway.routes[2].filters[1].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[2].filters[1].args.redis-rate-limiter.burstCapacity=20

# 重试配置
spring.cloud.gateway.routes[3].id=retry-route
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[3].filters[1].name=Retry
spring.cloud.gateway.routes[3].filters[1].args.retries=3
spring.cloud.gateway.routes[3].filters[1].args.statuses=5XX
spring.cloud.gateway.routes[3].filters[1].args.methods=GET,POST

# Hystrix 降级配置
spring.cloud.gateway.routes[4].id=hystrix-route
spring.cloud.gateway.routes[4].uri=lb://user-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[4].filters[1].name=Hystrix
spring.cloud.gateway.routes[4].filters[1].args.name=fallback
spring.cloud.gateway.routes[4].filters[1].args.fallbackUri=forward:/fallback

# 全局跨域
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# 路由元数据
spring.cloud.gateway.metadata.gateway-version=1.0.0
spring.cloud.gateway.metadata.gateway-region=default

# 健康检查
management.health.gateway.enabled=true
