# Gateway 生产环境配置（profile=prod 时启用）

server.port=8080

spring.application.name=gateway-service

# ===== Nacos Discovery =====
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER:localhost}:8848
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.metadata.version=1.0.0
spring.cloud.nacos.discovery.metadata.region=${REGION:default}

# ===== Nacos Config（prod 下用 yml 后缀，与原 yml 行为保持一致）=====
# 注：本 profile 仍为 properties 中心，file-extension 保持 properties。
# 若 prod 需要切 yml，请同步在 bootstrap.properties 把 file-extension 改为 yml。
spring.cloud.nacos.config.server-addr=${NACOS_SERVER:192.168.1.6}:8848
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.config.file-extension=properties
spring.cloud.nacos.config.refresh-enabled=true
# 共享配置：common（properties 后缀）
spring.cloud.nacos.config.shared-configs[0].data-id=common.properties
spring.cloud.nacos.config.shared-configs[0].group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.config.shared-configs[0].refresh=true

# ===== Gateway =====
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# 路由 0: user-service /api/user/**
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[0].order=1000

# 路由 1: tts-service /api/tts/**
spring.cloud.gateway.routes[1].id=tts-service
spring.cloud.gateway.routes[1].uri=lb://tts-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/tts/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[1].order=1000

# 全局跨域（生产环境建议限制域名）
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=https://yourdomain.com
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# 预过滤和后过滤
spring.cloud.gateway.preFilters[0].name=AuthFilter
spring.cloud.gateway.preFilters[0].args.enabled=true
spring.cloud.gateway.postFilters[0].name=LoggingFilter
spring.cloud.gateway.postFilters[0].args.enabled=true
spring.cloud.gateway.postFilters[1].name=MetricsFilter
spring.cloud.gateway.postFilters[1].args.enabled=true

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# ===== 日志 =====
logging.level.com.example.gateway=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/gateway-service.log
logging.file.max-size=100MB
logging.file.max-history=30
