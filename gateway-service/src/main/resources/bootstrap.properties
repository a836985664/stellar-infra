# Gateway 启动引导配置
# 说明：bootstrap.properties 只负责"引导"——指定服务名、连接 Nacos 配置中心、声明要加载的远端配置
# 业务路由、CORS 过滤器等放在 application.properties

spring.application.name=gateway-service
spring.cloud.nacos.config.server-addr=${NACOS_SERVER:localhost}:8848
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.config.file-extension=properties
spring.cloud.nacos.config.refresh-enabled=true
spring.cloud.nacos.config.import-check.enabled=false
# 注：Nacos Spring Cloud Alibaba 2023.x 已不再要求 spring.config.import，
# 仅保留 server-addr/file-extension 等元数据由 NacosConfigProperties 自动加载对应 data-id。
# 若后续需要共享 common 配置，请改用 spring.cloud.nacos.config.shared-configs[n].data-id，
# 不要在 spring.config.import 中硬写 nacos:common.yml/properties，原因：bootstrap 上下文未启用时该 import 会被 import-check 拦截。
