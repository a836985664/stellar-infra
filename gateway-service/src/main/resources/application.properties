# Gateway 运行时配置

server.port=8080

# ===== Nacos Discovery =====
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER:localhost}:8848
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:public}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.metadata.version=1.0.0

# ===== Gateway 服务发现路由 =====
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ===== Gateway 路由列表（按声明顺序，索引从 0 起）=====

# 路由 0: user-service /api/users/**
spring.cloud.gateway.routes[0].id=user-service-users
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# 路由 1: user-service /api/voice/**
spring.cloud.gateway.routes[1].id=user-service-voice
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/voice/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

# 路由 2: user-service /api/auth/**
spring.cloud.gateway.routes[2].id=user-service-auth
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=0

# 路由 3: user-service /api/stt/**
spring.cloud.gateway.routes[3].id=user-service-stt
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/stt/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0

# 路由 4: tts-service /api/tts/**
spring.cloud.gateway.routes[4].id=tts-service-tts
spring.cloud.gateway.routes[4].uri=lb://tts-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/tts/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=2

# 路由 5: user-service /config（TestController）
spring.cloud.gateway.routes[5].id=user-service-config
spring.cloud.gateway.routes[5].uri=lb://user-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/config
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=0

# ===== 全局跨域 =====
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# ===== Actuator =====
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ===== 日志 =====
logging.level.com.example.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

# ===== JWT（与 user-service 共用密钥）=====
jwt.secret=${JWT_SECRET:xyncyKe+TIJtTv2P/FUcx575oR9GU/Wvy7G7CeloqvM=}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===== 网关鉴权 =====
security.gateway.enabled=true
security.gateway.whitelist-exact[0]=/actuator/health
security.gateway.whitelist-exact[1]=/actuator/info
security.gateway.whitelist-exact[2]=/config
security.gateway.whitelist-exact[3]=/users/test
security.gateway.whitelist-prefixes[0]=/actuator/
security.gateway.whitelist-prefixes[1]=/api/auth/
security.gateway.whitelist-prefixes[2]=/swagger-ui
security.gateway.whitelist-prefixes[3]=/v3/api-docs
