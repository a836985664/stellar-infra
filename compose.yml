# docker 服务器上的镜像批量启动
services:
  gateway:               # 服务名 1（随便起，下面会变成容器名）
    image: gateway-service:1.0    # 用哪个镜像
    ports:                # 端口映射
      - "8081:8081"
    environment:          # 环境变量
      NACOS_SERVER: 192.168.1.6
  rabbitmq:              # 服务名 2
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8081:80"        # 宿主8081 -> 容器80（8080已给gateway）
    restart: unless-stopped